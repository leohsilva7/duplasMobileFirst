<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Etapa 3</title>

    <link rel="stylesheet" href="./css/tela3.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="./imgs/Logo.png" alt="Logo">
            <h1>COMPANY NAME</h1>
        </div>
        <a href="#" style="color: #E2E4E5; font-size: 28px;">×</a>
    </header>

    <main class="container">

        <div class="progress-steps">
            <a href="./index.html" class="step active"></a>
            <a href="./tela2.html" class="step active"></a>
            <a href="./tela3.html" class="step active"></a> </div>

        <div class="register-text">
            <h2>Registration</h2>
            <p>Fill in the registration data. It will take a couple of minutes. All you need is a phone number and e-mail</p>
        </div>

        <div class="info-box">
            <div>
                <span class="phone-number">+1 555 555-1234</span>
                <span class="status">✓ Number confirmed</span>
            </div>
        </div>

        <div class="form-container">
            <form action="#">
                <div class="form-group">
                    <label for="email">Enter your email</label>
                    <input type="email" id="email" name="email" value="alex_manager@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Set a password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" value="••••••••" required>
                        <button type="button" class="eye-icon">👁️</button>
                    </div>
                    <p class="password-helper">✓ Good password</p>
                </div>
                
                <div class="register-btn">
                    <a href="./pagina1.html">Register Now</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
