<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Name - Delivery Address</title>

    <link rel="stylesheet" href="./pagina3.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-content-wrapper">

        <div class="header">
            <div class="logo">
                <img src="./imgs/Logo.png" alt="logo"><h3>COMPANY NAME</h3>
            </div>
            <div> <img src="./imgs/Muted button.png" alt="fechar">
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot active"></div>
            </div>
        </div>
        
        <div class="sub">
            <h2>Profile info</h2>
            <p>Fill in the data for profile. It will take a couple of minutes. You only need a passport</p>
        </div>
        
        <div class="form">
            <h3>Delivery address</h3>
            <p>Used for shipping orders</p>

            <div class="sobrenome">
                <p>Address</p>
                <h4>47 W 13th St</h4>
                <div class="linhan"></div>
            </div>
            
            <div class="date">
                <p>City</p>
                <div class="input-com-seta">
                    <h4>New York</h4>
                    <span class="seta-dropdown">▼</span>
                </div>
                <div class="linhan"></div>
            </div>

            <div class="birth-info-row">
                <div class="date">
                    <p>Country</p>
                    <div class="input-com-seta">
                        <h4>USA</h4>
                        <span class="seta-dropdown">▼</span>
                    </div>
                    <div class="linhan"></div>
                </div>
                
                <div class="sobrenome">
                    <p>Zip code</p>
                    <h4>10011</h4>
                    <div class="linhan"></div>
                </div>
            </div>

            <div class="sobrenome">
                <p>Optional</p>
                <h4></h4> <div class="linhan"></div>
            </div>
        </div>

        <div class="button-container">
            <button class="save-btn">
              
                <a href="http://127.0.0.1:5500/index.html">✔️ Save</a>
            </button>
        </div>

    </div> </body>
</html>
